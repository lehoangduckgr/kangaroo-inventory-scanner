<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#008c45">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kangaroo Scanner">
  <title>Quét mã kiểm kê</title>
  <script src="https://unpkg.com/@zxing/browser@0.2.1"></script>
  <style>
    :root{color-scheme:dark;--kg:#00a651;--kg-dark:#006b35;--danger:#ff7b7b}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:#001f14;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    header{padding:10px 14px;min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,#008c45,#004e29)} h1{margin:0;font-size:18px}.brand{display:flex;align-items:center;gap:10px}.brand-copy{line-height:1.08}.brand-copy small{display:block;font-size:10px;opacity:.78;margin-top:4px;letter-spacing:.45px}
    main{width:min(720px,100%);margin:auto;padding:14px 14px max(24px,env(safe-area-inset-bottom))}
    .viewer{position:relative;height:min(62vh,500px);min-height:330px;overflow:hidden;border-radius:22px;background:#0f172a;border:2px solid rgba(0,166,81,.45)}
    video{width:100%;height:100%;object-fit:cover;display:block;background:#111827}
    .mask{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.62) 0 38%,transparent 38% 60%,rgba(0,0,0,.62) 60% 100%)}
    .roi{position:absolute;left:10%;right:10%;top:38%;height:22%;border:3px solid var(--kg);border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.05),0 0 20px rgba(0,166,81,.65);pointer-events:none}
    .roi:before,.roi:after{content:"";position:absolute;left:8%;right:8%;top:50%;height:2px;background:#7dffba;box-shadow:0 0 12px #00ff80}
    .roi-label{position:absolute;left:50%;top:calc(38% - 34px);transform:translateX(-50%);font-size:13px;font-weight:800;background:rgba(0,59,34,.92);padding:6px 10px;border-radius:999px;white-space:nowrap}
    .panel{margin-top:14px;padding:15px;border-radius:18px;border:1px solid #166534;background:#052e20}.hint{color:#d1fae5;font-size:14px;line-height:1.5}
    .btn{width:100%;border:0;border-radius:14px;padding:15px;margin-top:10px;font-size:16px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55}.primary{background:var(--kg);color:#fff}.secondary{background:#22543d;color:#fff}
    .status{min-height:24px;margin-top:12px;text-align:center;font-weight:700;line-height:1.4}.result{display:none;margin-top:12px;padding:13px;border-radius:14px;background:#063b29}.result-code{margin-top:7px;font-size:20px;font-weight:900;word-break:break-all} input[type=file]{display:none}
</style>
</head>
<body>
<header><div class="brand"><div class="brand-copy"><h1>QUÉT BARCODE / QR</h1><small>Warehouse Inventory System</small></div></div><button class="btn secondary" style="width:auto;margin:0;padding:10px 14px" onclick="cancelScan()">Đóng</button></header>
<main>
  <div class="viewer"><video id="preview" playsinline muted></video><div class="mask"></div><div class="roi"></div><div class="roi-label">CHỈ MÃ NẰM TRONG KHUNG XANH</div></div>
  <div class="panel">
    <div class="hint">Đưa đúng một barcode vào khung xanh hẹp. Phần nằm ngoài khung sẽ không được giải mã, giúp tránh nhận nhầm mã ở hàng trên hoặc hàng dưới.</div>
    <button id="startBtn" class="btn primary" onclick="startCamera()">BẮT ĐẦU QUÉT CAMERA</button>
    <button id="stopBtn" class="btn secondary" onclick="stopCamera()" style="display:none">DỪNG CAMERA</button>
    <button id="imageBtn" class="btn secondary" onclick="document.getElementById('fileInput').click()">CHỤP / CHỌN ẢNH ĐỂ ĐỌC MÃ</button>
    <input id="fileInput" type="file" accept="image/*" capture="environment" onchange="scanImage(event)">
    <div id="status" class="status"></div>
    <div id="resultBox" class="result"><div class="hint">Kết quả quét</div><div id="resultText" class="result-code"></div></div>
  </div>
</main>
<script>
const params=new URLSearchParams(location.search);
const currentTarget=params.get('target')||'';
const returnMode=params.get('returnMode')||'postMessage';
const codeReader=new ZXingBrowser.BrowserMultiFormatReader();
let stream=null,scanTimer=null,isStarting=false,completed=false,decoding=false;
const $=id=>document.getElementById(id);
function setStatus(m,e=false){$('status').textContent=m;$('status').style.color=e?'#ffaaaa':'#86efac'}
function setButtons(r){$('startBtn').style.display=r?'none':'block';$('stopBtn').style.display=r?'block':'none';$('startBtn').disabled=isStarting;$('imageBtn').disabled=isStarting||r}
async function startCamera(){if(isStarting||stream)return;completed=false;isStarting=true;setButtons(false);setStatus('Đang mở camera...');try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:960},height:{ideal:540}}});$('preview').srcObject=stream;await $('preview').play();setButtons(true);setStatus('Đưa đúng mã cần quét vào khung xanh.');scanTimer=setInterval(scanRoiFrame,150)}catch(e){stream=null;setButtons(false);setStatus('Không mở được camera: '+readableCameraError(e),true)}finally{isStarting=false}}
async function scanRoiFrame(){if(decoding||completed||!stream||$('preview').readyState<2)return;decoding=true;try{const v=$('preview'),vw=v.videoWidth,vh=v.videoHeight;if(!vw||!vh)return;const x=Math.round(vw*.10),y=Math.round(vh*.38),w=Math.round(vw*.80),h=Math.round(vh*.22);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d',{willReadFrequently:true}).drawImage(v,x,y,w,h,0,0,w,h);const r=await codeReader.decodeFromCanvas(c);if(r)completeScan(r.getText())}catch(_){ }finally{decoding=false}}
async function stopCamera(show=true){if(scanTimer){clearInterval(scanTimer);scanTimer=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('preview').srcObject=null;setButtons(false);if(show)setStatus('Đã dừng camera.')}
async function completeScan(raw){const value=String(raw||'').trim();if(!value||completed)return;completed=true;await stopCamera(false);if(navigator.vibrate)navigator.vibrate(80);sendResult(value)}
function sendResult(value){
  if(returnMode==='postMessage'&&window.opener&&!window.opener.closed){
    window.opener.postMessage({type:'KANGAROO_SCAN_RESULT',target:currentTarget,value},'*');
    $('resultBox').style.display='block';
    $('resultText').textContent=value;
    setStatus('Đã gửi mã về ứng dụng. Đang đóng Scanner...');

    // Không gọi window.opener.focus(): Safari iOS có thể dựng lại/reload Web App.
    // Chỉ đóng tab Scanner; Safari sẽ tự quay về tab trước.
    setTimeout(()=>{
      try{window.close()}catch(_){}
    },120);
    return;
  }
  $('resultBox').style.display='block';
  $('resultText').textContent=value;
  setStatus('Đã đọc mã thành công.');
  completed=false;
}
async function scanImage(ev){const file=ev.target.files&&ev.target.files[0];if(!file)return;$('imageBtn').disabled=true;setStatus('Đang đọc vùng giữa ảnh...');let url='';try{await stopCamera(false);url=URL.createObjectURL(file);const img=new Image();img.src=url;await img.decode();const canvases=prepareImageCrops(img);let result=null;for(const c of canvases){try{result=await codeReader.decodeFromCanvas(c);if(result)break}catch(_){}}if(!result)throw new Error('not found');await completeScan(result.getText())}catch(_){completed=false;setStatus('Không đọc được mã. Hãy chụp gần, đặt mã ở chính giữa và tránh để mã khác lọt vào vùng giữa.',true)}finally{if(url)URL.revokeObjectURL(url);ev.target.value='';$('imageBtn').disabled=false}}
function prepareImageCrops(img){const max=1600,s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),W=Math.round(img.naturalWidth*s),H=Math.round(img.naturalHeight*s);const base=document.createElement('canvas');base.width=W;base.height=H;base.getContext('2d',{willReadFrequently:true}).drawImage(img,0,0,W,H);const crops=[];[[.08,.32,.84,.36],[.04,.20,.92,.60],[0,0,1,1]].forEach(([rx,ry,rw,rh])=>{const c=document.createElement('canvas');c.width=Math.round(W*rw);c.height=Math.round(H*rh);c.getContext('2d',{willReadFrequently:true}).drawImage(base,W*rx,H*ry,W*rw,H*rh,0,0,c.width,c.height);crops.push(c)});return crops}
async function cancelScan(){await stopCamera(false);if(window.opener&&!window.opener.closed){window.opener.postMessage({type:'KANGAROO_SCAN_CANCEL'},'*')}window.close()}
function readableCameraError(e){const t=String(e&&(e.message||e.name)||e||'Lỗi');if(/NotAllowed|Permission|denied/i.test(t))return'Safari chưa được cấp quyền Camera. Vào aA > Cài đặt trang web > Camera > Cho phép.';if(/NotFound/i.test(t))return'Không tìm thấy camera.';if(/NotReadable|TrackStart|Abort/i.test(t))return'Camera đang được ứng dụng khác sử dụng.';return t}
window.addEventListener('pagehide',()=>stopCamera(false));
window.addEventListener('DOMContentLoaded',()=>{if(currentTarget)setTimeout(startCamera,120)});
</script>
</body></html>
